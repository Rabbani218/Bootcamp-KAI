name: Deploy Backend to Hugging Face Spaces

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy_backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Deploy to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: Alex-Universe11/Bootcamp-UBSI-KAI
        run: |
          # Copy Dataset folder to backend so it gets deployed
          cp -r Dataset backend/Dataset
          
          # Initialize git and push to Hugging Face
          cd backend
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Force push the backend folder to Hugging Face Space main branch
          git init
          git checkout -b main
          git add .
          git commit -m "Auto deploy from GitHub Actions"
          git remote add space https://user:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE
          git push -f space main
